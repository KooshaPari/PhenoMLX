name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip tag publish (for testing)"
        required: false
        default: "false"

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign OIDC signing in goreleaser

jobs:
  build:
    name: Build multi-arch binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — pinned

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862f26700835fb  # v5.0.4 — pinned
        with:
          go-version: "1.23"
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templ + tidy
        run: |
          templ generate
          go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build (linux/amd64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/hfscope-linux-amd64 ./cmd/hfscope
          sha256sum dist/hfscope-linux-amd64 > dist/hfscope-linux-amd64.sha256
      - name: Build (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/hfscope-linux-arm64 ./cmd/hfscope
          sha256sum dist/hfscope-linux-arm64 > dist/hfscope-linux-arm64.sha256
      - name: Build (darwin/amd64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/hfscope-darwin-amd64 ./cmd/hfscope
          sha256sum dist/hfscope-darwin-amd64 > dist/hfscope-darwin-amd64.sha256
      - name: Build (darwin/arm64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/hfscope-darwin-arm64 ./cmd/hfscope
          sha256sum dist/hfscope-darwin-arm64 > dist/hfscope-darwin-arm64.sha256
      - name: Build (windows/amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/hfscope-windows-amd64.exe ./cmd/hfscope
          sha256sum dist/hfscope-windows-amd64.exe > dist/hfscope-windows-amd64.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.4 — pinned
        with:
          name: hfscope-binaries
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8 — pinned
        with:
          name: hfscope-binaries
          path: dist/

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@5a8d9d9a1a51cf0edd5f3a9f0c934e75b41d7c7c  # v2.1.0 — pinned
        with:
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: |
          echo "Dry run — would publish:"
          ls -la dist/
