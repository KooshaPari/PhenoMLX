<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HFScope — Quick search</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; font: 13px ui-sans-serif, system-ui; }
    body { width: 380px; padding: 12px; background: #fff; color: #111; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #c9d1d9; }
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    header h1 { font: 600 12px ui-sans-serif; margin: 0; flex: 1; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
    header a { font-size: 11px; opacity: 0.7; text-decoration: none; color: inherit; }
    header a:hover { opacity: 1; }
    label { font: 11px ui-sans-serif; opacity: 0.6; display: block; text-transform: uppercase; letter-spacing: 0.06em; margin: 6px 0 2px; }
    input, select {
      width: 100%; box-sizing: border-box;
      padding: 6px 8px;
      background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    @media (prefers-color-scheme: dark) {
      input, select { background: #161b22; border-color: #30363d; color: #c9d1d9; }
    }
    button {
      margin-top: 12px; width: 100%;
      padding: 7px 0;
      background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #388bfd; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .note { font-size: 11px; opacity: 0.6; margin-top: 12px; line-height: 1.4; }
    code { font: 11px ui-monospace, monospace; }
  </style>
</head>
<body>
  <header>
    <h1>HFScope</h1>
    <a id="open-tab" href="#" target="_blank">↗</a>
  </header>

  <label>Search</label>
  <input type="search" id="q" placeholder="llama, mistral, …" autofocus>

  <div class="row">
    <div>
      <label>Type</label>
      <select id="kind">
        <option value="models">Models</option>
        <option value="spaces">Spaces</option>
        <option value="datasets">Datasets</option>
      </select>
    </div>
    <div>
      <label>Limit</label>
      <input type="number" id="limit" value="20" min="1" max="50">
    </div>
  </div>

  <button id="open">Open in HFScope</button>

  <p class="note">
    Tip: press <code>⌘/Ctrl-Shift-K</code> from anywhere. <code>Alt+H</code> opens the side panel on any huggingface.co page (server running on <code id="host">…</code>).
  </p>

  <script type="module" src="popup.js"></script>
</body>
</html>
