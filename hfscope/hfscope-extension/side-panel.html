<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFScope — Side Panel</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    #hfscope-root { height: 100vh; width: 100vw; background: #0d1117; }
    #hfscope-root iframe {
      width: 100%; height: 100%; border: 0; display: block;
      background: #0d1117;
    }
    #hfscope-loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #c9d1d9; font: 13px ui-sans-serif, system-ui;
      flex-direction: column; gap: 0.5rem;
    }
    #hfscope-loading .spinner {
      width: 24px; height: 24px; border: 2px solid #30363d;
      border-top-color: #58a6ff; border-radius: 50%;
      animation: hfscope-spin 0.8s linear infinite;
    }
    @keyframes hfscope-spin { to { transform: rotate(360deg); } }
    #hfscope-error {
      padding: 1rem; color: #f85149; font: 12px ui-monospace, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="hfscope-root">
    <div id="hfscope-loading">
      <div class="spinner"></div>
      <div>Loading HFScope…</div>
    </div>
  </div>
  <script type="module" src="side-panel.js"></script>
</body>
</html>
