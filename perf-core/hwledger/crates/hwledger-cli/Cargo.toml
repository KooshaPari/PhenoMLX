[package]
name = "hwledger-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for hwLedger dev servers, benchmarks, and service management"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
anyhow = "1"
chrono = "0.4"

[[bin]]
name = "hwledger"
path = "src/main.rs"
