[package]
name = "hwledger-app"
version = "0.1.0"
description = "hwLedger - LLM Capacity Planner + Fleet Ledger"
authors = ["Koosha Pari"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hwledger_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]
