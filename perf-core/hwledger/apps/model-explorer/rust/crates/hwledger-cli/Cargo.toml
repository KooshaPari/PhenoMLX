[package]
name = "hwledger-explorer-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true
description = "CLI front-end for the hwledger model-explorer search stack"

[[bin]]
name = "hwledger-explorer-cli"
path = "src/main.rs"

[dependencies]
hwledger-search-core = { workspace = true }
hwledger-search-index = { workspace = true }
hwledger-search-ingest = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
comfy-table = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }