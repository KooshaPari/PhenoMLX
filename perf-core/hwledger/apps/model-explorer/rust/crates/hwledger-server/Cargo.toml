[package]
name = "hwledger-server"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true
description = "HTTP server bundling all hwledger search crates"

[[bin]]
name = "hwledger-server"
path = "src/main.rs"

[lib]
name = "hwledger_server"
path = "src/lib.rs"

[dependencies]
hwledger-search-core = { workspace = true }
hwledger-search-index = { workspace = true }
hwledger-search-skills = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"