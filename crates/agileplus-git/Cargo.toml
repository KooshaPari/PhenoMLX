[package]
name = "agileplus-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AgilePlus"
description = "agileplus git — Phenotype infrastructure crate (AgilePlus)"
documentation = "https://docs.rs/agileplus-git"
keywords = ["phenotype", "agileplus", "git"]
categories = ["development-tools::version-control"]
authors = ["kooshapari"]

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
agileplus-triage = { path = "../agileplus-triage" }
anyhow.workspace = true
async-trait = "0.1"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
gix = { version = "0.83", default-features = false, features = [
  "worktree-stream",
  "revision",
  "sha1",
] }
notify = "8"
async-nats = "0.47"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
toml = "0.8"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[package.metadata.cargo-machete]
ignored = [
  "async-nats",
  "chrono",
  "gix",
  "notify",
  "serde",
  "serde_json",
  "toml",
  "tracing",
]
