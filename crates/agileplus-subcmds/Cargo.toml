[package]
name = "agileplus-subcmds"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AgilePlus CLI subcommands (platform, dashboard, events, sync)"
documentation = "https://docs.rs/agileplus-subcmds"
keywords = ["phenotype", "agileplus"]
categories = ["development-tools", "command-line-utilities"]
authors = ["kooshapari"]

[features]
default = ["platform"]
# Full subcommand surface (needs extra crates that may be parked).
full = ["dashboard", "events", "sync", "audit", "registry"]
platform = []
dashboard = []
events = []
sync = []
audit = []
registry = []

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
